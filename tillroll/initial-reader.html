<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Initial receipt reader</title>
  <link rel="stylesheet" href="./style.css?v=followup3">
  <style>
    .reader-shell{max-width:60rem;margin:2rem auto;padding:0 1rem}
    .reader-card{background:#fff;border:1px solid #e1e4da;border-radius:14px;padding:1rem;margin:1rem 0}
    .reader-actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    #reader-status{min-height:1.5rem}
    .reader-result{border-top:1px solid #e5e7eb;margin-top:1rem;padding-top:1rem}
    .reader-result pre{white-space:pre-wrap;overflow:auto;background:#f7f8f4;padding:.75rem;border-radius:8px}
    .reader-flag{padding:.35rem .55rem;border-radius:6px;margin:.25rem 0;background:#fde68a}
    .reader-flag.pink{background:#fecdd3}
    .reader-back{display:inline-block;margin-top:1rem}
  </style>
</head>
<body>
  <header><div class="bar"><a class="brand" href="./" aria-label="Tillroll home">Tillroll</a></div></header>
  <main class="reader-shell">
    <h1>Initial receipt reader</h1>
    <p>Read the receipt fundamentals first. This page keeps the printed values separate from official catalogue evidence.</p>
    <section class="reader-card">
      <label for="reader-files">Receipt photos</label>
      <input id="reader-files" type="file" accept="image/*,.heic,.heif" multiple>
      <div class="reader-actions"><button id="reader-run" class="primary" type="button">Read selected photos</button><span id="reader-status" role="status" aria-live="polite"></span></div>
    </section>
    <section id="reader-results" aria-live="polite"></section>
    <a class="reader-back" href="./">Back to Tillroll</a>
  </main>
  <script type="module" src="./initial-reader-page.js?v=1"></script>
</body>
</html>
